<style>
/* ===== Challenge Page Styles ===== */
.progress-bar-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  margin-bottom: 28px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.progress-label {
  font-family: var(--font-mono);
  font-size: 0.95rem;
  color: var(--accent-gold);
  white-space: nowrap;
  font-weight: 600;
}
.progress-track {
  flex: 1; min-width: 160px; height: 10px;
  background: var(--bg-deep);
  border-radius: 5px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-green));
  transition: width 0.5s ease;
}
.chapter-tabs {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 24px;
}
.chapter-tab {
  padding: 6px 14px; border-radius: 20px;
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  color: var(--text-secondary); cursor: pointer;
  font-size: 0.82rem; font-family: var(--font-mono);
  transition: all var(--transition-fast);
  user-select: none;
}
.chapter-tab:hover { border-color: var(--accent-gold); color: var(--text-primary); }
.chapter-tab.active {
  background: var(--accent-gold-dim); border-color: var(--accent-gold);
  color: var(--accent-gold); font-weight: 600;
}
.challenge-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
}
.challenge-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
  opacity: 0.5;
}
.challenge-card.correct {
  border-color: var(--accent-green) !important;
  box-shadow: 0 0 24px rgba(78,201,176,0.15);
}
.challenge-card.correct::before {
  background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan));
  opacity: 1;
}
.challenge-card.wrong {
  border-color: var(--accent-red) !important;
  animation: shake 0.5s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.challenge-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.challenge-chapter {
  font-family: var(--font-mono); font-size: 0.72rem;
  padding: 3px 10px; border-radius: 12px;
  background: var(--accent-blue-dim); color: var(--accent-blue);
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.challenge-status {
  font-size: 1.1rem; margin-left: auto;
}
.challenge-title {
  font-family: var(--font-display);
  font-size: 1.35rem; color: var(--text-primary);
  margin-bottom: 4px;
}
.challenge-instruction {
  color: var(--text-secondary); font-size: 0.92rem;
  margin-bottom: 18px; line-height: 1.6;
}
/* Choice */
.choice-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.choice-opt {
  padding: 12px 16px; border-radius: var(--radius-md);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  cursor: pointer; transition: all var(--transition-fast);
  color: var(--text-primary); font-size: 0.92rem; line-height: 1.5;
  user-select: none;
}
.choice-opt:hover { border-color: var(--accent-gold); background: var(--bg-hover); }
.choice-opt.selected { border-color: var(--accent-gold); background: var(--accent-gold-dim); }
.choice-opt.correct-reveal { border-color: var(--accent-green); background: var(--accent-green-dim); color: var(--accent-green); }
.choice-opt.wrong-reveal { border-color: var(--accent-red); background: var(--accent-red-dim); color: var(--accent-red); opacity: 0.7; }
/* Scenario options - longer text */
.scenario-opt {
  padding: 14px 18px; border-radius: var(--radius-md);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  cursor: pointer; transition: all var(--transition-fast);
  color: var(--text-primary); font-size: 0.9rem; line-height: 1.6;
  user-select: none; margin-bottom: 10px;
}
.scenario-opt:hover { border-color: var(--accent-purple); background: var(--bg-hover); }
.scenario-opt.selected { border-color: var(--accent-purple); background: var(--accent-purple-dim); }
.scenario-opt .opt-label {
  font-family: var(--font-mono); font-weight: 700; color: var(--accent-gold);
  margin-right: 8px;
}
.scenario-opt .opt-desc {
  display: block; color: var(--text-secondary); font-size: 0.84rem;
  margin-top: 4px;
}
.scenario-opt.correct-reveal { border-color: var(--accent-green); background: var(--accent-green-dim); }
.scenario-opt.wrong-reveal { border-color: var(--accent-red); background: var(--accent-red-dim); opacity: 0.7; }
.scenario-text {
  background: var(--bg-deep); padding: 16px; border-radius: var(--radius-md);
  margin-bottom: 16px; font-family: var(--font-mono); font-size: 0.85rem;
  line-height: 1.7; color: var(--text-secondary); white-space: pre-wrap;
}
/* Sort */
.sort-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.sort-item {
  padding: 12px 16px; border-radius: var(--radius-md);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  cursor: grab; transition: all var(--transition-fast);
  display: flex; align-items: center; gap: 12px;
  user-select: none; color: var(--text-primary); font-size: 0.92rem;
}
.sort-item:active { cursor: grabbing; }
.sort-item.dragging {
  opacity: 0.9; border-color: var(--accent-cyan);
  box-shadow: 0 4px 20px rgba(137,221,255,0.2);
  transform: scale(1.02); z-index: 10;
}
.sort-item.drag-over { border-color: var(--accent-gold); background: var(--accent-gold-dim); }
.sort-item .sort-num {
  font-family: var(--font-mono); font-weight: 700;
  color: var(--accent-gold); width: 20px; text-align: center;
}
.sort-item .sort-grip {
  color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px;
}
/* Match */
.match-area { display: flex; gap: 40px; margin-bottom: 16px; justify-content: center; flex-wrap: wrap; position: relative; }
.match-col { display: flex; flex-direction: column; gap: 10px; min-width: 140px; flex: 1; max-width: 280px; }
.match-item {
  padding: 10px 14px; border-radius: var(--radius-md);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  cursor: pointer; transition: all var(--transition-fast);
  font-size: 0.88rem; text-align: center; user-select: none;
  color: var(--text-primary);
}
.match-item:hover { border-color: var(--accent-cyan); }
.match-item.active { border-color: var(--accent-gold); background: var(--accent-gold-dim); box-shadow: 0 0 12px rgba(232,167,65,0.2); }
.match-item.paired { border-color: var(--accent-cyan); background: var(--accent-blue-dim); }
.match-item.correct-reveal { border-color: var(--accent-green); background: var(--accent-green-dim); }
.match-item.wrong-reveal { border-color: var(--accent-red); background: var(--accent-red-dim); }
.match-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.match-line {
  position: absolute; height: 2px;
  background: var(--accent-cyan); opacity: 0.5;
  transform-origin: left center; transition: background 0.3s, opacity 0.3s;
}
.match-line.correct-line { background: var(--accent-green); opacity: 0.8; }
.match-line.wrong-line { background: var(--accent-red); opacity: 0.8; }
.match-pairs-display {
  font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-muted);
  margin-bottom: 8px; min-height: 20px;
}
/* Fill */
.fill-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.fill-input {
  padding: 10px 14px; border-radius: var(--radius-md);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  color: var(--text-primary); font-family: var(--font-mono);
  font-size: 1rem; width: 200px; outline: none;
  transition: border-color var(--transition-fast);
}
.fill-input:focus { border-color: var(--accent-gold); }
.fill-hint {
  font-size: 0.82rem; color: var(--text-muted); font-style: italic;
}
/* Buttons */
.check-btn {
  padding: 10px 24px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-amber));
  border: none; color: #fff; font-weight: 700;
  font-family: var(--font-body); font-size: 0.92rem;
  cursor: pointer; transition: all var(--transition-fast);
  user-select: none;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.check-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(232,167,65,0.3); }
.check-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.reset-btn {
  padding: 8px 18px; border-radius: var(--radius-md);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  color: var(--text-secondary); font-family: var(--font-body);
  font-size: 0.85rem; cursor: pointer; margin-left: 8px;
  transition: all var(--transition-fast);
}
.reset-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
/* Explanation */
.explanation {
  margin-top: 16px; padding: 16px 20px;
  background: var(--accent-green-dim); border-left: 3px solid var(--accent-green);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  color: var(--text-primary); font-size: 0.9rem; line-height: 1.6;
  display: none;
}
.explanation.visible { display: block; animation: fadeIn 0.4s ease; }
.explanation.wrong-explanation {
  background: var(--accent-red-dim); border-left-color: var(--accent-red);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
/* Sparkle */
.sparkle-container {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.sparkle {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-gold);
  animation: sparkleAnim 0.8s ease-out forwards;
}
@keyframes sparkleAnim {
  0% { opacity: 1; transform: scale(1) translate(0, 0); }
  100% { opacity: 0; transform: scale(0) translate(var(--tx), var(--ty)); }
}
/* Responsive */
@media (max-width: 640px) {
  .challenge-card { padding: 20px 18px; }
  .match-area { flex-direction: column; gap: 16px; align-items: stretch; }
  .match-col { max-width: none; }
  .progress-bar-wrap { flex-direction: column; align-items: stretch; gap: 10px; }
}
</style>

var TOTAL = CHALLENGES.length;

/* ===== State ===== */
var storageKey = 'cc-challenges-v1';
var completed = {};
try { completed = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch(e){}
function saveState(){ localStorage.setItem(storageKey, JSON.stringify(completed)); }
function markComplete(id){ completed[id] = true; saveState(); updateProgress(); }
function isComplete(id){ return !!completed[id]; }

/* ===== Progress ===== */
function updateProgress(){
  var count = 0;
  CHALLENGES.forEach(function(c){ if(isComplete(c.id)) count++; });
  $('progressLabel').textContent = '已通过 ' + count + '/' + TOTAL + ' 关';
  $('progressFill').style.width = (count/TOTAL*100) + '%';
  /* Update status icons */
  CHALLENGES.forEach(function(c){
    var statusEl = document.querySelector('[data-status="'+c.id+'"]');
    if(statusEl) statusEl.textContent = isComplete(c.id) ? '\u2705' : '';
  });
}

/* ===== Sparkle Effect ===== */
function sparkle(card){
  var sc = ce('div','sparkle-container');
  card.appendChild(sc);
  for(var i=0;i<18;i++){
    var s = ce('div','sparkle');
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.setProperty('--tx',(Math.random()*80-40)+'px');
    s.style.setProperty('--ty',(Math.random()*80-40)+'px');
    s.style.animationDelay = (Math.random()*0.3)+'s';
    s.style.background = ['var(--accent-gold)','var(--accent-cyan)','var(--accent-green)','#fff'][Math.floor(Math.random()*4)];
    sc.appendChild(s);
  }
  setTimeout(function(){ sc.remove(); }, 1200);
}

/* ===== Chapter Tabs ===== */
function getChapters(){
  var seen = {}; var list = ['all'];
  CHALLENGES.forEach(function(c){ if(!seen[c.chapter]){ seen[c.chapter]=true; list.push(c.chapter); }});
  return list;
}

var activeChapter = 'all';
function renderTabs(){
  var tabs = $('chapterTabs');
  tabs.innerHTML = '';
  getChapters().forEach(function(ch){
    var tab = ce('div','chapter-tab' + (ch===activeChapter?' active':''), ch==='all'?'全部':esc(ch));
    tab.onclick = function(){ activeChapter=ch; renderTabs(); renderChallenges(); };
    tabs.appendChild(tab);
  });
}

/* ===== Render Challenges ===== */
function renderChallenges(){
  var container = $('challengeContainer');
  container.innerHTML = '';
  CHALLENGES.forEach(function(c){
    if(activeChapter!=='all' && c.chapter!==activeChapter) return;
    var card = ce('div','challenge-card' + (isComplete(c.id)?' correct':''));
    card.id = 'card-'+c.id;
    /* Header */
    var header = ce('div','challenge-header');
    header.innerHTML = '<span class="challenge-chapter">'+esc(c.chapter)+'\x3c/span>' +
      '<span class="challenge-status" data-status="'+c.id+'">'+(isComplete(c.id)?'\u2705':'')+'\x3c/span>';
    card.appendChild(header);
    /* Title */
    var h2 = ce('h2','challenge-title'); h2.id = c.id; h2.textContent = c.title;
    card.appendChild(h2);

    if(c.type==='choice') renderChoice(card, c);
    else if(c.type==='sort') renderSort(card, c);
    else if(c.type==='match') renderMatch(card, c);
    else if(c.type==='fill') renderFill(card, c);
    else if(c.type==='scenario') renderScenario(card, c);

    container.appendChild(card);
  });
}

/* ===== Type 1: Choice ===== */
function renderChoice(card, c){
  var p = ce('div','challenge-instruction'); p.textContent = c.question; card.appendChild(p);
  var opts = ce('div','choice-options');
  var selected = -1;
  var locked = isComplete(c.id);
  c.options.forEach(function(opt, i){
    var el = ce('div','choice-opt'+(locked&&i===c.correct?' correct-reveal':''));
    el.textContent = opt;
    el.onclick = function(){
      if(locked) return;
      selected = i;
      opts.querySelectorAll('.choice-opt').forEach(function(o,j){ o.className = 'choice-opt'+(j===i?' selected':''); });
    };
    opts.appendChild(el);
  });
  card.appendChild(opts);
  if(!locked){
    var btnRow = ce('div','');
    var btn = ce('button','check-btn','验证');
    btn.onclick = function(){
      if(selected<0) return;
      locked = true;
      if(selected===c.correct){
        card.classList.add('correct');
        opts.children[selected].className = 'choice-opt correct-reveal';
        markComplete(c.id);
        sparkle(card);
        showExplanation(card, c.explanation, false);
      } else {
        card.classList.add('wrong');
        opts.children[selected].className = 'choice-opt wrong-reveal';
        opts.children[c.correct].className = 'choice-opt correct-reveal';
        showExplanation(card, c.explanation, true);
        setTimeout(function(){ card.classList.remove('wrong'); },600);
        setTimeout(function(){ locked=false; },1000);
      }
    };
    btnRow.appendChild(btn);
    card.appendChild(btnRow);
  } else {
    showExplanation(card, c.explanation, false, true);
  }
}

/* ===== Type 2: Sort ===== */
function renderSort(card, c){
  var p = ce('div','challenge-instruction'); p.textContent = c.instruction; card.appendChild(p);
  var list = ce('div','sort-list');
  /* Shuffle items */
  var indices = c.correctOrder.slice();
  if(!isComplete(c.id)){
    for(var i=indices.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=indices[i]; indices[i]=indices[j]; indices[j]=t; }
  }
  var currentOrder = indices.slice();
  var locked = isComplete(c.id);

  function rebuildList(){
    list.innerHTML = '';
    currentOrder.forEach(function(idx, pos){
      var item = ce('div','sort-item');
      item.innerHTML = '<span class="sort-grip">\u2261\x3c/span><span class="sort-num">'+(pos+1)+'\x3c/span><span>'+esc(c.items[idx])+'\x3c/span>';
      item.setAttribute('data-pos', pos);
      if(!locked){
        /* Drag support */
        item.draggable = true;
        item.addEventListener('dragstart', function(e){
          e.dataTransfer.setData('text/plain', pos);
          item.classList.add('dragging');
        });
        item.addEventListener('dragend', function(){ item.classList.remove('dragging'); });
        item.addEventListener('dragover', function(e){ e.preventDefault(); item.classList.add('drag-over'); });
        item.addEventListener('dragleave', function(){ item.classList.remove('drag-over'); });
        item.addEventListener('drop', function(e){
          e.preventDefault(); item.classList.remove('drag-over');
          var fromPos = parseInt(e.dataTransfer.getData('text/plain'));
          var toPos = parseInt(item.getAttribute('data-pos'));
          if(fromPos!==toPos){
            var tmp = currentOrder[fromPos]; currentOrder[fromPos]=currentOrder[toPos]; currentOrder[toPos]=tmp;
            rebuildList();
          }
        });
        /* Click to swap (mobile) */
        item.addEventListener('click', function(){
          var allItems = list.querySelectorAll('.sort-item');
          var activeItem = list.querySelector('.sort-item.dragging');
          if(activeItem){
            var fromPos = parseInt(activeItem.getAttribute('data-pos'));
            var toPos = parseInt(item.getAttribute('data-pos'));
            activeItem.classList.remove('dragging');
            if(fromPos!==toPos){
              var tmp = currentOrder[fromPos]; currentOrder[fromPos]=currentOrder[toPos]; currentOrder[toPos]=tmp;
              rebuildList();
            }
          } else {
            allItems.forEach(function(it){ it.classList.remove('dragging'); });
            item.classList.add('dragging');
          }
        });
      }
      list.appendChild(item);
    });
  }
  rebuildList();
  card.appendChild(list);

  if(!locked){
    var btnRow = ce('div','');
    var btn = ce('button','check-btn','验证顺序');
    btn.onclick = function(){
      var isCorrect = true;
      for(var i=0;i<c.correctOrder.length;i++){
        if(currentOrder[i]!==c.correctOrder[i]){ isCorrect=false; break; }
      }
      if(isCorrect){
        locked=true; card.classList.add('correct');
        markComplete(c.id); sparkle(card);
        showExplanation(card, c.explanation, false);
      } else {
        card.classList.add('wrong');
        showExplanation(card, '顺序不对，再试试！提示：' + c.explanation, true);
        setTimeout(function(){ card.classList.remove('wrong'); },600);
      }
    };
    var resetBtn = ce('button','reset-btn','重置');
    resetBtn.onclick = function(){
      for(var i=currentOrder.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=currentOrder[i]; currentOrder[i]=currentOrder[j]; currentOrder[j]=t; }
      rebuildList();
      var oldExp = card.querySelector('.explanation');
      if(oldExp) oldExp.remove();
    };
    btnRow.appendChild(btn); btnRow.appendChild(resetBtn);
    card.appendChild(btnRow);
  } else {
    showExplanation(card, c.explanation, false, true);
  }
}

/* ===== Type 3: Match ===== */
function renderMatch(card, c){
  var p = ce('div','challenge-instruction'); p.textContent = c.instruction; card.appendChild(p);
  var locked = isComplete(c.id);
  var pairs = []; /* [{l:idx, r:idx}] */
  var activeLeft = -1;
  var pairsDisplay = ce('div','match-pairs-display');
  card.appendChild(pairsDisplay);

  var area = ce('div','match-area');
  var leftCol = ce('div','match-col');
  var rightCol = ce('div','match-col');

  function updatePairsDisplay(){
    if(pairs.length===0){ pairsDisplay.textContent='点击左侧项目，再点击右侧项目进行连线'; return; }
    pairsDisplay.innerHTML = pairs.map(function(p){
      return esc(c.left[p.l]) + ' \u2194 ' + esc(c.right[p.r]);
    }).join(' &nbsp;|&nbsp; ');
  }
  updatePairsDisplay();

  function isLeftPaired(i){ return pairs.some(function(p){return p.l===i;}); }
  function isRightPaired(i){ return pairs.some(function(p){return p.r===i;}); }

  function rebuildItems(){
    leftCol.innerHTML=''; rightCol.innerHTML='';
    c.left.forEach(function(txt,i){
      var cls = 'match-item' + (isLeftPaired(i)?' paired':'') + (activeLeft===i?' active':'');
      if(locked){
        var isCorrect = c.correctPairs.some(function(cp){ return cp[0]===i; });
        cls = 'match-item' + (isCorrect?' correct-reveal':'');
      }
      var el = ce('div',cls,esc(txt));
      if(!locked){
        el.onclick = function(){
          if(isLeftPaired(i)){
            pairs = pairs.filter(function(p){return p.l!==i;});
            activeLeft = -1;
          } else {
            activeLeft = i;
          }
          rebuildItems(); updatePairsDisplay();
        };
      }
      leftCol.appendChild(el);
    });
    c.right.forEach(function(txt,i){
      var cls = 'match-item' + (isRightPaired(i)?' paired':'');
      if(locked){
        var isCorrect = c.correctPairs.some(function(cp){ return cp[1]===i; });
        cls = 'match-item' + (isCorrect?' correct-reveal':'');
      }
      var el = ce('div',cls,esc(txt));
      if(!locked){
        el.onclick = function(){
          if(activeLeft<0) return;
          if(isRightPaired(i)){
            pairs = pairs.filter(function(p){return p.r!==i;});
          }
          pairs.push({l:activeLeft, r:i});
          activeLeft = -1;
          rebuildItems(); updatePairsDisplay();
        };
      }
      rightCol.appendChild(el);
    });
  }
  rebuildItems();
  area.appendChild(leftCol); area.appendChild(rightCol);
  card.appendChild(area);

  if(!locked){
    var btnRow = ce('div','');
    var btn = ce('button','check-btn','验证连线');
    btn.onclick = function(){
      if(pairs.length!==c.left.length){ return; }
      var allCorrect = true;
      c.correctPairs.forEach(function(cp){
        var found = pairs.some(function(p){ return p.l===cp[0] && p.r===cp[1]; });
        if(!found) allCorrect = false;
      });
      if(allCorrect){
        locked=true; card.classList.add('correct');
        markComplete(c.id); sparkle(card);
        rebuildItems();
        showExplanation(card, c.explanation, false);
      } else {
        card.classList.add('wrong');
        showExplanation(card, '有些连线不对，再试试！', true);
        setTimeout(function(){ card.classList.remove('wrong'); },600);
      }
    };
    var resetBtn = ce('button','reset-btn','清除');
    resetBtn.onclick = function(){
      pairs=[]; activeLeft=-1; rebuildItems(); updatePairsDisplay();
      var oldExp = card.querySelector('.explanation');
      if(oldExp) oldExp.remove();
    };
    btnRow.appendChild(btn); btnRow.appendChild(resetBtn);
    card.appendChild(btnRow);
  } else {
    showExplanation(card, c.explanation, false, true);
  }
}

/* ===== Type 4: Fill ===== */
function renderFill(card, c){
  var p = ce('div','challenge-instruction'); p.textContent = c.question; card.appendChild(p);
  var locked = isComplete(c.id);
  var row = ce('div','fill-row');
  var input = ce('input','fill-input');
  input.type = 'text';
  input.placeholder = '输入答案...';
  if(locked){ input.value = c.answer; input.disabled = true; }
  row.appendChild(input);
  if(c.hint && !locked){
    var hint = ce('span','fill-hint','提示：'+c.hint);
    row.appendChild(hint);
  }
  card.appendChild(row);

  if(!locked){
    var btnRow = ce('div','');
    var btn = ce('button','check-btn','验证');
    btn.onclick = function(){
      var val = input.value.trim().toLowerCase();
      if(!val) return;
      if(val === String(c.answer).toLowerCase()){
        locked=true; card.classList.add('correct');
        input.disabled = true;
        markComplete(c.id); sparkle(card);
        showExplanation(card, c.explanation, false);
      } else {
        card.classList.add('wrong');
        showExplanation(card, '答案不对，再想想！' + (c.hint ? ' 提示：'+c.hint : ''), true);
        setTimeout(function(){ card.classList.remove('wrong'); },600);
      }
    };
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') btn.click(); });
    btnRow.appendChild(btn);
    card.appendChild(btnRow);
  } else {
    showExplanation(card, c.explanation, false, true);
  }
}

/* ===== Type 5: Scenario ===== */
function renderScenario(card, c){
  var scenarioBox = ce('div','scenario-text'); scenarioBox.textContent = c.scenario;
  card.appendChild(scenarioBox);
  var locked = isComplete(c.id);
  var selected = -1;
  var optsWrap = ce('div','');

  c.options.forEach(function(opt, i){
    var cls = 'scenario-opt' + (locked&&i===c.correct?' correct-reveal':'');
    var el = ce('div', cls);
    el.innerHTML = '<span class="opt-label">'+esc(opt.label)+'\x3c/span>' +
      '<span class="opt-desc">'+esc(opt.desc)+'\x3c/span>';
    if(!locked){
      el.onclick = function(){
        selected = i;
        optsWrap.querySelectorAll('.scenario-opt').forEach(function(o,j){
          o.className = 'scenario-opt'+(j===i?' selected':'');
        });
      };
    }
    optsWrap.appendChild(el);
  });
  card.appendChild(optsWrap);

  if(!locked){
    var btnRow = ce('div','');
    var btn = ce('button','check-btn','提交决策');
    btn.onclick = function(){
      if(selected<0) return;
      locked=true;
      if(selected===c.correct){
        card.classList.add('correct');
        optsWrap.children[selected].className = 'scenario-opt correct-reveal';
        markComplete(c.id); sparkle(card);
        showExplanation(card, c.explanation, false);
      } else {
        card.classList.add('wrong');
        optsWrap.children[selected].className = 'scenario-opt wrong-reveal';
        optsWrap.children[c.correct].className = 'scenario-opt correct-reveal';
        showExplanation(card, c.explanation, true);
        setTimeout(function(){ card.classList.remove('wrong'); },600);
        setTimeout(function(){ locked=false; },1000);
      }
    };
    btnRow.appendChild(btn);
    card.appendChild(btnRow);
  } else {
    showExplanation(card, c.explanation, false, true);
  }
}

/* ===== Show Explanation ===== */
function showExplanation(card, text, isWrong, instant){
  var old = card.querySelector('.explanation');
  if(old) old.remove();
  var el = ce('div','explanation'+(isWrong?' wrong-explanation':''));
  el.textContent = text;
  card.appendChild(el);
  if(instant){
    el.classList.add('visible');
  } else {
    setTimeout(function(){ el.classList.add('visible'); }, 50);
  }
}

/* ===== Init ===== */
renderTabs();
renderChallenges();
updateProgress();
})();
</script>
